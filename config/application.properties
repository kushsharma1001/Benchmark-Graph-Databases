# ---------------------------------------------------------------------------
# Passwords below have NO default on purpose: you
# inject them at runtime, e.g.
#
#   COGNODB_PASSWORD=... AURA_PASSWORD=... \
#     java -jar target/gdbench.jar all
#
# Point the harness at this file with either:
#   java -Dgdbench.properties=config/application.properties -jar target/gdbench.jar all
# or just place it at config/application.properties (auto-detected).
#
# The keys map to each platform's <PREFIX>_URI / _USER / _PASSWORD triple used
# by config/platforms.yaml. A property key and its env-var name are identical.
# ---------------------------------------------------------------------------

# --- CognoDB Cloud (free c0 tier) ---
COGNODB_URI=${COGNODB_URI}
COGNODB_USER=${COGNODB_USER}
COGNODB_PASSWORD=${COGNODB_PASSWORD}

# --- Neo4j Aura Free ---
AURA_URI=${AURA_URI}
AURA_USER=${AURA_USER}
AURA_PASSWORD=${AURA_PASSWORD}

# --- Memgraph Cloud (free tier) ---
MEMGRAPH_CLOUD_URI=${MEMGRAPH_CLOUD_URI}
MEMGRAPH_CLOUD_USER=${MEMGRAPH_CLOUD_USER}
MEMGRAPH_CLOUD_PASSWORD=${MEMGRAPH_CLOUD_PASSWORD}

# --- Local Neo4j (Docker, resource-capped) — see scripts/local-neo4j.sh ---
LOCAL_NEO4J_URI=${LOCAL_NEO4J_URI}
LOCAL_NEO4J_USER=${LOCAL_NEO4J_USER}
LOCAL_NEO4J_PASSWORD=${LOCAL_NEO4J_PASSWORD}

# --- Local Memgraph (Docker, resource-capped) — see scripts/local-memgraph.sh ---
LOCAL_MEMGRAPH_URI=${LOCAL_MEMGRAPH_URI}
LOCAL_MEMGRAPH_USER=${LOCAL_MEMGRAPH_USER}
LOCAL_MEMGRAPH_PASSWORD=${LOCAL_MEMGRAPH_PASSWORD}

# --- Local ArcadeDB (Docker, resource-capped) — see scripts/local-arcadedb.sh ---
LOCAL_ARCADEDB_URI=${LOCAL_ARCADEDB_URI}
LOCAL_ARCADEDB_USER=${LOCAL_ARCADEDB_USER}
LOCAL_ARCADEDB_PASSWORD=${LOCAL_ARCADEDB_PASSWORD}
